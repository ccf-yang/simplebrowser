[package]
name = "browser_http_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Verified against the mirror: 2.13.0. Must match pubspec.yaml exactly.
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }

# Verified against the local clone:
#   version 0.16.1, Apache-2.0, edition 2024, rust-version 1.98.
#   TLS backend: btls/btls-sys 0.5.6 (BoringSSL fork).
# `prefix-symbols` avoids linker conflicts when the host app also links OpenSSL.
wreq = { version = "0.16.1", default-features = false, features = [
    "tokio-rt",
    "webpki-roots",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
    "stream",
    "socks",
    "ws",
    "tracing",
    "prefix-symbols",
] }

# Verified: 0.2.0, Apache-2.0. Provides the `Emulation` presets, including
# SafariIos26 / SafariIos18_1_1 (see docs/DEPENDENCIES.md).
wreq-util = "0.2.0"

[lints.rust]
# Emitted by flutter_rust_bridge's macro expansion.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
